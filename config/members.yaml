# 官号UID（周程表管道A使用）
official_uid: "3493085336046382"

# 录播回填配置（管道C：直播结束后定时扫描成员投稿，匹配回放并回填 recording_bvid）
recording:
  enabled: true
  window_hours: 72          # 时间窗：只匹配「事件时间后 72 小时内」上传的视频
  before_minutes: 30        # 允许上传时间略早于事件时间（定时投稿），单位分钟
  min_length_minutes: 30    # 视频时长短于此视为切片，不是完整回放
  page_size: 30             # 投稿列表每页条数（接口上限）
  max_pages: 2              # 每个账号最多扫描前几页投稿
  request_gap_seconds: 2    # 账号之间的请求间隔，降低风控风险
  # 额外录播组账号（录播由粉丝组/官方账号代传时配置），支持三种归属方式：
  # - member_key：专属录播号，投稿全部归属该成员（单播事件）
  # - group_type：团播录播号，投稿全部归属对应团播分组（团播事件，member=unknown）
  # - title_map：混合账号，按视频标题关键词推断归属成员（与上两种互斥）
  accounts:
    - name: "A-SOUL团播录播组"
      uid: "547510303"
      group_type: "asoul"     # 团播事件（游戏室/夜谈等）的录播来源
    - name: "心宜录播组"
      uid: "1970200754"
      member_key: "xinyi"
    - name: "思诺录播组"
      uid: "3493076389595522"
      member_key: "sinuo"

# 周程表动态正文关键词（管道A：命中才做 VLM 识别，防止把活动海报误当周程表）
schedule_keywords:
  - "周程"
  - "本周"
  - "日程"
  - "直播安排"

# 突击直播关键词配置（管道B Stage 1 预筛）
keywords:
  include:
    - "突击"
    - "加场"
    - "临时"
    - "今晚"
    - "今天"
    - "马上"
    - "等下"
    - "直播预约"
    - "开播"
    - "速来"
    - "惊喜"
    - "特别放送"
  exclude:
    - "周报"
    - "日程"
    - "请假"
    - "休息"
    - "停播"
    - "公告"
    - "生日会预约"
