name: 人工审核操作

on:
  workflow_dispatch:
    inputs:
      target:
        description: "审核对象"
        required: true
        type: choice
        options:
          - schedule
          - flash
      action:
        description: "审核动作"
        required: true
        type: choice
        options:
          - publish
          - reject

# 与其他管道共用并发组，串行执行避免同时 commit 数据冲突
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # 需要 push 数据变更

    steps:
      # Node 20 已弃用：使用 v5 版本（Node 24 运行时）
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行审核操作
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/review_action.py --target ${{ inputs.target }} --action ${{ inputs.action }}

      - name: 提交数据变更
        run: |
          git config user.name "review-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ archive/
          git diff --cached --quiet || git commit -m "review: ${{ inputs.action }} ${{ inputs.target }}"
          git push

      # 发布后正式数据文件镜像到国内 OSS（客户端就近读取）；
      # 未配置 OSS 环境变量时脚本静默跳过，不影响主流程。
      - name: 同步到国内 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PREFIX: ${{ vars.OSS_PREFIX }}
        run: python scripts/sync_oss.py
