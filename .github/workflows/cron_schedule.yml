name: 周程表定时抓取与识别

on:
  schedule:
    # 每30分钟运行一次（UTC时间，北京时间 = UTC+8）
    - cron: "*/30 * * * *"
  workflow_dispatch: # 支持手动触发

# 与突击直播管道共用并发组，串行执行避免同时 commit 数据冲突
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  fetch-and-recognize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # 需要 push 数据变更

    steps:
      # Node 20 已弃用：使用 v5 版本（Node 24 运行时）
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行周程表管道
        env:
          BILIBILI_UID: ${{ secrets.BILIBILI_UID }}
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          BILI_PROXY_URL: ${{ secrets.BILI_PROXY_URL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/main.py --mode schedule

      - name: 提交数据变更
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ archive/
          git diff --cached --quiet || git commit -m "auto: 更新周程数据"
          git push

      # 正式数据文件镜像到国内 OSS（客户端就近读取）；
      # 未配置 OSS 环境变量时脚本静默跳过，不影响主流程。
      - name: 同步到国内 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PREFIX: ${{ vars.OSS_PREFIX }}
        run: python scripts/sync_oss.py
