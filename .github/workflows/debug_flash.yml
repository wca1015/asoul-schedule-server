name: 调试·突击识别异常复现（手动，只读）

# 一次性诊断工作流：复现「突击直播识别异常」告警的根因。
# 只读运行：不写 data/、不发通知（未注入 FEISHU_WEBHOOK）。
# 排查完成后可删除本文件与 scripts/debug_flash_repro.py。

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行复现脚本
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python -u scripts/debug_flash_repro.py
