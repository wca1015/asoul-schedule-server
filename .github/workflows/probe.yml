name: 匿名接口探测（临时）

on:
  workflow_dispatch:
    inputs:
      proxy_url:
        description: "临时指定反代地址（留空则用 secrets.BILI_PROXY_URL）"
        required: false
        type: string
      proxy_key:
        description: "反代共享密钥（可选，留空则用 secrets.BILI_PROXY_KEY）"
        required: false
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install requests

      - name: 匿名探测（不带任何 Cookie）
        run: python probe_anonymous.py

      - name: 匿名探测第二轮（buvid + WBI buvid3 签名）
        run: python probe_anonymous2.py

      - name: 隔离探测·嘉然（成员投稿）
        run: python probe_anonymous3.py 672328094

      - name: 隔离探测·思诺（成员投稿）
        run: python probe_anonymous3.py 3537115310721781

      - name: 隔离探测·嘉然录播组
        run: python probe_anonymous3.py 247210788

      - name: RSSHub 官方源镜像
        run: curl -s "https://rsshub.app/bilibili/user/dynamic/3493085336046382" | head -c 300

      # 反代 Worker 验证：直连 vs 走 BILI_PROXY_URL（海外 GitHub runner 视角，
      # 与生产管道同环境；workers.dev 在国内被墙，本机无法验证）
      # always()：无论前面步骤成败都执行，保证能拿到这份对比结果；
      # 也可通过手动触发时传入 proxy_url 临时指定待测反代
      - name: 反代 Worker 验证
        if: always()
        env:
          BILI_PROXY_URL: ${{ inputs.proxy_url || secrets.BILI_PROXY_URL }}
          BILI_PROXY_KEY: ${{ inputs.proxy_key || secrets.BILI_PROXY_KEY }}
        run: python probe_proxy.py
