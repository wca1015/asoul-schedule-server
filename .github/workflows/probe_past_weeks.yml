name: 构造往日周归档（临时）

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run 只打印不写文件"
        type: boolean
        default: false

# 与其他管道共用并发组，避免同时 commit 数据冲突
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 构造往日周归档
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/build_past_weeks.py --dry-run
          else
            python scripts/build_past_weeks.py
          fi

      - name: 提交数据变更
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ archive/
          git diff --cached --quiet || git commit -m "auto: 构造过去4周往日周归档（真实录播）"
          git push

      - name: 同步到国内 OSS
        if: ${{ !inputs.dry_run }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PREFIX: ${{ vars.OSS_PREFIX }}
        run: python scripts/sync_oss.py
